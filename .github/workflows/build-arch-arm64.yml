name: Build Arch Linux ARM

# Compile Cemu dans un conteneur Arch Linux ARM (même base que le diting).
# Lancement manuel uniquement.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou commit à compiler (vide = main)"
        required: false

jobs:
  build:
    name: build-archlinuxarm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          submodules: "recursive"
          fetch-depth: 0

      - name: "Cache vcpkg"
        uses: actions/cache@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-archarm-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-archarm-

      - name: "Create Arch Linux ARM image"
        run: |
          curl -fsSL -o alarm.tar.gz https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          docker import alarm.tar.gz alarm:latest
          rm alarm.tar.gz
          mkdir -p "$HOME/vcpkg-cache"

      - name: "Build package with makepkg in Arch Linux ARM"
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD":/src \
            -v "$PWD/out":/out \
            -v "$HOME/vcpkg-cache":/vcpkg-cache \
            -w /src \
            alarm:latest bash -euxc '
              sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm --needed base-devel git sudo
              # makepkg refuse de tourner en root : utilisateur dédié
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chown -R builder /src /vcpkg-cache
              mkdir -p /out && chown builder /out
              sudo -u builder git config --global --add safe.directory "*"
              cd /src/dist/linux/arch
              sudo -u builder env \
                PKGDEST=/out \
                VCPKG_BINARY_SOURCES="clear;files,/vcpkg-cache,readwrite" \
                makepkg -sf --noconfirm
            '
          sudo chown -R "$USER" "$PWD" "$HOME/vcpkg-cache"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cemu-archlinuxarm-pkg
          path: out/*.pkg.tar.*
