# DHCP for the pad subnet, mirroring the console layout:
#   console 192.168.1.10/24, pad always gets 192.168.1.11
#   (libdrc web/docs/network.rst:127-138, web/docs/re/wifi.rst:56-57)
# DHCP only: port=0 disables DNS. Bound to the harness interface only.
port=0
interface=@IFACE@
bind-interfaces
dhcp-authoritative
# No "is the address free?" ping before offering: the pad itself still holds 192.168.1.11 from its last session
# and answers it, so dnsmasq said "no address available" for 87 s (runs/20261008-212730-padnet/dnsmasq.log) and
# the pad gave up. 192.168.1.11 is only ever the pad's.
no-ping
dhcp-range=192.168.1.11,192.168.1.11,255.255.255.0,1h
dhcp-leasefile=@RUNDIR@/dnsmasq.leases
log-dhcp
# Stay root: the lease/log files live in a root-only run dir.
user=root
