# hostapd config for the hwsim harness, console side. Derived from drc-hostap conf/wiiu_ap_normal.conf
# (third_party/drc-hostap-vanilla). Changes vs the sample: interface placeholder, ctrl_interface path,
# no ctrl_interface_group, and the SSID built from the AP's own MAC like a real console ("WiiU<mac>"; the sample's
# is a fixed WiiUaabbccddeeff). Everything else verbatim, including the sample's test PSK.

interface=@IFACE@
driver=nl80211
logger_stdout=-1
logger_stdout_level=0
ctrl_interface=@RUNDIR@/hostapd
hw_mode=a
channel=36
beacon_int=100
dtim_period=3
macaddr_acl=0
auth_algs=3
wmm_enabled=1
uapsd_advertisement_enabled=1
wmm_ac_be_acm=0
wmm_ac_be_aifs=2
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=5
wmm_ac_be_txop_limit=47
wmm_ac_bk_acm=0
wmm_ac_bk_aifs=7
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_txop_limit=0
wmm_ac_vi_acm=0
wmm_ac_vi_aifs=3
wmm_ac_vi_cwmin=4
wmm_ac_vi_cwmax=5
wmm_ac_vi_txop_limit=94
wmm_ac_vo_acm=0
wmm_ac_vo_aifs=3
wmm_ac_vo_cwmin=4
wmm_ac_vo_cwmax=5
wmm_ac_vo_txop_limit=47
ieee80211n=1
ssid=WiiU@MAC@
ignore_broadcast_ssid=2
wpa=2
wpa_psk=@PSK@
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
