# hostapd config for the hwsim harness, console side, PAIRING mode. Derived from drc-hostap
# conf/wiiu_ap_pairing.conf (third_party/drc-hostap-vanilla). Changes vs the sample: interface placeholder,
# ctrl_interface path, no ctrl_interface_group, no wps_pin_requests file, and skip_cred_build + extra_cred so
# WPS hands out the NORMAL network's credentials (hostapd/hostapd.conf:2870-2881; scripts/make-wps-cred.py).
# Made to look like a real console's pairing beacon (dvdhrm's 2013 capture, see docs/PROTOCOL.md "Pairing AP"):
# SSID "WiiU" + first 11 hex digits of the MAC + the full MAC + "_STA1"; WPS IE under the Nintendo OUI
# (wps_nintendo_ie, patches/hostapd/0002: also WPS 1.0 attributes, config methods 0x0084); the extra vendor
# element a4:c0:e1 f5 00; and the Broadcom element 00:10:18 02 00 00 04 00 00 the console also sends.

interface=@IFACE@
driver=nl80211
logger_stdout=-1
logger_stdout_level=0
ctrl_interface=@RUNDIR@/hostapd
hw_mode=a
channel=36
beacon_int=100
dtim_period=3
macaddr_acl=0
auth_algs=3
wmm_enabled=1
uapsd_advertisement_enabled=1
wmm_ac_be_acm=0
wmm_ac_be_aifs=2
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=5
wmm_ac_be_txop_limit=47
wmm_ac_bk_acm=0
wmm_ac_bk_aifs=7
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_txop_limit=0
wmm_ac_vi_acm=0
wmm_ac_vi_aifs=3
wmm_ac_vi_cwmin=4
wmm_ac_vi_cwmax=5
wmm_ac_vi_txop_limit=94
wmm_ac_vo_acm=0
wmm_ac_vo_aifs=3
wmm_ac_vo_cwmin=4
wmm_ac_vo_cwmax=5
wmm_ac_vo_txop_limit=47
ieee80211n=1
ssid=WiiU@MAC11@@MAC@_STA1
ieee8021x=1
eapol_version=1
eap_server=1
wps_state=2
uuid=22210203-0405-0607-0809-0a0b0c0d0e0f
manufacturer=Broadcom
model_name=SoftAP
model_number=0
serial_number=0
device_type=6-a4c0e1f4-1
device_name=WiiU@MAC@
os_version=80000000
config_methods=label push_button
skip_cred_build=1
extra_cred=@RUNDIR@/normal.cred
wps_nintendo_ie=1
vendor_elements=dd09001018020000040000
